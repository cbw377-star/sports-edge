<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172033"><link rel="manifest" href="manifest.webmanifest">
<title>SPORTS EDGE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;font-family:Arial,sans-serif;color:#172033}
.app{max-width:480px;margin:auto;background:#f8f9fc;min-height:100vh}.head{background:#172033;color:white;padding:20px;border-radius:0 0 25px 25px}
.logo{display:inline-grid;place-items:center;width:42px;height:42px;background:white;color:#172033;border-radius:13px;font-weight:900;margin-right:10px}.title{font-weight:900;font-size:18px}.sub{display:block;font-size:10px;color:#bdc7d6;margin-top:5px}
main{padding:13px}.card{background:white;border:1px solid #e2e6ed;border-radius:17px;padding:15px;margin-bottom:11px}
h3{font-size:15px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;padding:11px;border:1px solid #dce2ea;border-radius:10px;font-size:12px;background:white}
button{border:0;border-radius:11px;padding:11px;font-weight:900;font-size:12px}.primary{width:100%;margin-top:9px;background:#4e55e8;color:white}.green{width:100%;margin-top:8px;background:#1d8d66;color:white}.dark{width:100%;margin-top:8px;background:#172033;color:white}
.result{margin-top:10px;background:#f0f2ff;border-radius:12px;padding:12px;font-size:11px;line-height:1.7}.small{font-size:10px;color:#7c8595}.game{border:1px solid #e2e6ed;border-radius:13px;padding:11px;margin-top:9px}.gh{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:12px}.del{background:#ffe8e8;color:#c62828;padding:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.three{display:grid;grid-template-columns:1fr 1fr 90px;gap:7px;margin-top:8px}.combo{padding:9px 0;border-bottom:1px solid #e7eaf0;font-size:11px}.warn{background:#fff4d6;color:#8a6200;border-radius:10px;padding:9px;font-size:10px;margin-top:8px}.event{padding:11px 0;border-bottom:1px solid #edf0f4}.teams{display:flex;justify-content:space-between;text-align:center;font-weight:900;font-size:11px}.teams>*{width:40%}.teams span{width:20%;color:#8a93a2}
</style></head><body><div class="app">
<header class="head"><span class="logo">SE</span><span class="title">SPORTS EDGE</span><span class="sub">경기 분석 · 배당 분석 · 폴더 조합기</span></header><main>

<section class="card"><h3>① 경기 입력</h3><div class="grid">
<input id="home" placeholder="홈 팀"><input id="away" placeholder="원정 팀">
<input id="h" type="number" step=".01" placeholder="승패 홈 배당"><input id="a" type="number" step=".01" placeholder="승패 원정 배당">
<input id="handicap" placeholder="핸디 기준 예: -1.5"><input id="total" placeholder="언오버 기준 예: 2.5">
<input id="hh" type="number" step=".01" placeholder="핸디 홈 배당"><input id="ha" type="number" step=".01" placeholder="핸디 원정 배당">
<input id="over" type="number" step=".01" placeholder="오버 배당"><input id="under" type="number" step=".01" placeholder="언더 배당"></div>
<button class="primary" onclick="analyze()">전체 분석</button><div class="result" id="result">배당을 입력하면 자동으로 분석합니다.</div></section>

<section class="card"><h3>② 폴더 조합기</h3><div class="small">경기를 여러 개 추가하고 각 경기의 선택과 배당을 입력하세요.</div>
<div id="games"></div>
<button class="primary" onclick="addGame()">＋ 경기 추가</button>
<button class="dark" onclick="games=[];renderGames();document.getElementById('combos').innerHTML='아직 조합이 없습니다.'">전체 초기화</button>
<div class="result" id="summary">경기를 추가하세요.</div>
<select id="n" style="margin-top:8px"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
<button class="green" onclick="makeCombos()">선택한 폴더 조합 만들기</button><div class="result" id="combos">아직 조합이 없습니다.</div></section>

<section class="card"><h3>③ 실제 배당 불러오기</h3>
<input id="api" placeholder="The Odds API Key">
<select id="sport" style="margin-top:8px">
<option value="soccer_korea_k_league_1">K리그1</option><option value="soccer_epl">EPL</option><option value="soccer_spain_la_liga">라리가</option><option value="soccer_germany_bundesliga">분데스리가</option><option value="soccer_italy_serie_a">세리에A</option><option value="soccer_france_ligue_one">리그1</option><option value="soccer_netherlands_eredivisie">에레디비시</option><option value="soccer_portugal_primeira_liga">포르투갈 리그</option><option value="soccer_uefa_champs_league">챔피언스리그</option><option value="soccer_uefa_europa_league">유로파리그</option><option value="soccer_uefa_europa_conference_league">컨퍼런스리그</option><option value="soccer_usa_mls">MLS</option><option value="baseball_mlb">MLB</option><option value="basketball_nba">NBA</option></select>
<button class="primary" onclick="saveApi()">API 저장</button><button class="green" onclick="getOdds()">실제 배당 가져오기</button>
<div class="small" style="display:block;margin-top:8px">가져온 경기에서 현재 입력 또는 폴더에 추가할 수 있습니다.</div><div id="events"></div></section>
</main></div>

<script>
let games=[],gid=0;const $=x=>document.getElementById(x);
function analyze(){let H=$('home').value||'홈',A=$('away').value||'원정';$('result').innerHTML='<b>'+H+' vs '+A+'</b><br>승패 '+p($('h').value,$('a').value,H,A)+'<br>핸디 '+p($('hh').value,$('ha').value,H,A)+'<br>언오버 '+p($('over').value,$('under').value,'오버','언더')}
function p(a,b,x,y){a=+a;b=+b;if(!(a>1&&b>1))return '배당 입력 필요';let s=1/a+1/b;return x+' '+a.toFixed(2)+' → '+(100/a/s).toFixed(1)+'% / '+y+' '+b.toFixed(2)+' → '+(100/b/s).toFixed(1)+'%'}
function addGame(d={}){games.push({id:++gid,home:d.home||'',away:d.away||'',pick:d.pick||'',odds:d.odds||''});renderGames()}
function renderGames(){let b=$('games');b.innerHTML=games.map((g,i)=>'<div class="game"><div class="gh"><span>'+(i+1)+'번 경기</span><button class="del" onclick="games=games.filter(x=>x.id!='+g.id+');renderGames()">삭제</button></div><div class="two"><input value="'+e(g.home)+'" placeholder="홈 팀" oninput="games['+i+'].home=this.value"><input value="'+e(g.away)+'" placeholder="원정 팀" oninput="games['+i+'].away=this.value"></div><div class="three"><select onchange="games['+i+'].type=this.value"><option>승패</option><option>핸디</option><option>언오버</option></select><select onchange="games['+i+'].pick=this.value;summary()"><option value="">선택</option><option>'+e(g.home||'홈')+' 승</option><option>'+e(g.away||'원정')+' 승</option><option>오버</option><option>언더</option></select><input type="number" step=".01" value="'+e(g.odds)+'" placeholder="배당" oninput="games['+i+'].odds=this.value;summary()"></div></div>').join('');summary()}
function e(x){return String(x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function summary(){let v=games.filter(g=>g.pick&&+g.odds>1);$('summary').innerHTML='총 <b>'+games.length+'경기</b> / 선택 완료 <b>'+v.length+'경기</b>'+(v.length?'<br>'+v.map(g=>e(g.pick)+' @ <b>'+ (+g.odds).toFixed(2)+'</b>').join('<br>'):'')}
function makeCombos(){let k=+$('n').value,v=games.filter(g=>g.pick&&+g.odds>1);if(v.length<k){$('combos').innerHTML='<div class="warn">'+k+'폴더에는 최소 '+k+'경기가 필요합니다.</div>';return}let out=[];function f(s,a){if(a.length==k){out.push(a.slice());return}for(let i=s;i<=v.length-(k-a.length);i++){a.push(v[i]);f(i+1,a);a.pop()}}f(0,[]);$('combos').innerHTML='<b>'+k+'폴더 조합 '+out.length+'개</b>'+out.slice(0,30).map((c,i)=>{let t=c.reduce((z,g)=>z*+g.odds,1);return '<div class="combo"><b>'+(i+1)+'.</b> '+c.map(g=>e(g.pick)).join(' + ')+'<br>총배당 <b>'+t.toFixed(2)+'배</b> · 단순 역수 '+(100/t).toFixed(1)+'%</div>'}).join('')+(out.length>30?'<div class="small">처음 30개만 표시합니다.</div>':'')}
function saveApi(){localStorage.setItem('se',JSON.stringify({api:$('api').value.trim(),sport:$('sport').value}));alert('API를 저장했습니다.')}
async function getOdds(){let k=$('api').value.trim();if(!k){alert('API Key를 입력하세요.');return}$('events').innerHTML='가져오는 중...';try{let u='https://api.the-odds-api.com/v4/sports/'+encodeURIComponent($('sport').value)+'/odds/?apiKey='+encodeURIComponent(k)+'&regions=us&markets=h2h,spreads,totals&oddsFormat=decimal';let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();window.ev=d;$('events').innerHTML=d.slice(0,15).map((x,i)=>'<div class="event"><div class="teams"><div>'+e(x.home_team)+'</div><span>VS</span><div>'+e(x.away_team)+'</div></div><button class="primary" onclick="use('+i+')">현재 경기 입력</button><button class="dark" onclick="addApi('+i+')">폴더에 추가</button></div>').join('')||'경기가 없습니다.'}catch(x){$('events').innerHTML='<div class="warn">API 오류: '+e(x.message)+'</div>'}}
function use(i){let x=ev[i];$('home').value=x.home_team;$('away').value=x.away_team;analyze();scrollTo(0,0)}
function addApi(i){let x=ev[i];addGame({home:x.home_team,away:x.away_team});document.getElementById('games').scrollIntoView({behavior:'smooth'})}
addGame();
</script></body></html>
